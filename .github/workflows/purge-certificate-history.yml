name: Remove previous certificate PDFs from Git history

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/purge-certificate-history.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: certificate-history-privacy-cleanup
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current public portfolio and its history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install history-cleaning utility
        run: python -m pip install --disable-pip-version-check git-filter-repo 'pymupdf>=1.24,<1.28'

      - name: Verify and preserve only current privacy-redacted files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sama-safe-pdfs"
          python - <<'PY'
          from pathlib import Path
          import shutil
          import fitz
          safe = [0, 1, 2, 3, 4, 6, 7, 8]
          source = Path('public/certificates')
          dest = Path(__import__('os').environ['RUNNER_TEMP']) / 'sama-safe-pdfs'
          found = sorted(p.name for p in source.glob('*.pdf'))
          expected = sorted(f'certificate-{n}.pdf' for n in safe)
          if found != expected:
              raise RuntimeError(f'Unexpected certificate list: {found}')
          for index in safe:
              pdf = source / f'certificate-{index}.pdf'
              doc = fitz.open(pdf)
              if len(doc) != 1 or doc[0].get_text().strip():
                  raise RuntimeError(f'Certificate is not a flattened page: {pdf}')
              if len(doc[0].get_images()) != 1:
                  raise RuntimeError(f'Certificate is not one flattened image: {pdf}')
              doc.close()
              shutil.copy2(pdf, dest / pdf.name)
          print('Verified eight flattened public PDF copies.')
          PY

      - name: Remove every prior version of the certificate directory from main history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git filter-repo --force --refs refs/heads/main --path public/certificates/ --invert-paths

          mkdir -p public/certificates
          cp "$RUNNER_TEMP"/sama-safe-pdfs/certificate-*.pdf public/certificates/
          git add public/certificates
          git commit -m 'Restore only sanitized certificate PDFs after privacy history cleanup'

          count=$(git rev-list --objects refs/heads/main | grep -c ' public/certificates/certificate-.*\.pdf$' || true)
          if [ "$count" -ne 8 ]; then
            echo "Unexpected count of reachable certificate PDFs: $count"
            exit 1
          fi
          echo 'History check passed: eight current PDF objects; no older certificate copies reachable from main.'

          git remote get-url origin >/dev/null 2>&1 || git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease="refs/heads/main:${GITHUB_SHA}" origin HEAD:refs/heads/main

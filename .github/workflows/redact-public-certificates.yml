name: Publish privacy-safe certificate copies

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/redact-public-certificates.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF tools
        run: python -m pip install --disable-pip-version-check 'pymupdf>=1.24,<1.28' 'Pillow>=10,<13'
      - name: Replace publicly displayed certificates with sanitized, image-only copies
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from PIL import Image, ImageDraw, ImageFont
          import fitz

          directory = Path('public/certificates')
          # Only the eight certificates supplied by the portfolio owner are public.
          # The intermediate Power BI and Excel data analysis certificates are pending.
          indexes = [0, 1, 2, 3, 4, 6, 7, 8]
          institute = {0, 1, 2, 3, 7}
          font_path = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'

          for number in indexes:
              path = directory / f'certificate-{number}.pdf'
              if not path.is_file():
                  raise FileNotFoundError(path)
              source = fitz.open(path)
              if len(source) != 1:
                  raise ValueError(f'Unexpected page count in {path}')
              page = source[0]
              if not 1.35 < page.rect.width / page.rect.height < 1.5:
                  raise ValueError(f'Unexpected aspect ratio in {path}')
              pix = page.get_pixmap(matrix=fitz.Matrix(1.7, 1.7), alpha=False, colorspace=fitz.csRGB)
              image = Image.frombytes('RGB', (pix.width, pix.height), pix.samples)
              width, height = image.size

              if number in institute:
                  draw = ImageDraw.Draw(image)
                  # Replace the original expanded personal name with only
                  # the owner's chosen display name; discard the original pixels.
                  draw.rectangle((int(.303 * width), int(.411 * height),
                                  int(.695 * width), int(.484 * height)), fill='white')
                  font = ImageFont.truetype(font_path, int(height * .048))
                  draw.text((int(width * .5), int(height * .446)),
                            'سما العيسي', font=font, fill=(37, 169, 164),
                            anchor='mm', direction='rtl')
                  # Hide personal certificate QR codes in public copies.
                  draw.rectangle((int(.881 * width), int(.798 * height),
                                  int(.959 * width), int(.902 * height)), fill='white')

              # Render into a fresh image-only PDF so hidden text and
              # any previously masked national-ID text cannot be recovered.
              jpg = BytesIO()
              image.save(jpg, format='JPEG', quality=87, optimize=True, subsampling=0)
              clean = fitz.open()
              dest = clean.new_page(width=page.rect.width, height=page.rect.height)
              dest.insert_image(dest.rect, stream=jpg.getvalue())
              clean.set_metadata({
                  'title': f'SAMA public course certificate {number}',
                  'author': 'SAMA Portfolio',
                  'subject': 'Public privacy-redacted certificate',
                  'creator': 'SAMA Portfolio'
              })
              output = BytesIO()
              clean.save(output, garbage=4, clean=True, deflate=True)
              clean.close()
              source.close()
              path.write_bytes(output.getvalue())
              verify = fitz.open(path)
              if verify[0].get_text().strip():
                  raise RuntimeError(f'Unredacted searchable text in {path}')
              if len(verify) != 1 or len(verify[0].get_images()) != 1:
                  raise RuntimeError(f'Unexpected output PDF structure in {path}')
              verify.close()
              print(f'Sanitized certificate-{number}.pdf ({path.stat().st_size} bytes)')
          PY
      - name: Commit redacted certificate files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/certificates/certificate-0.pdf public/certificates/certificate-1.pdf public/certificates/certificate-2.pdf public/certificates/certificate-3.pdf public/certificates/certificate-4.pdf public/certificates/certificate-6.pdf public/certificates/certificate-7.pdf public/certificates/certificate-8.pdf
          if git diff --cached --quiet; then
            echo 'Certificates already sanitized.'
          else
            git commit -m 'Replace public certificates with privacy-redacted short-name copies'
            git push origin HEAD:main
          fi